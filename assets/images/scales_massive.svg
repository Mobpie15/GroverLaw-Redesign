<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 480" class="w-full h-auto max-w-[560px] select-none" aria-label="Groverlaw - Heavy Scales of Justice">
  <defs>
    <!-- Solid Vibrant Brand Orange Gradients -->
    <linearGradient id="masOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA8C16" />
      <stop offset="35%" stop-color="#EB6A1D" />
      <stop offset="100%" stop-color="#C85310" />
    </linearGradient>

    <!-- Beam Gradient -->
    <linearGradient id="masBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C85310" />
      <stop offset="20%" stop-color="#EB6A1D" />
      <stop offset="50%" stop-color="#FFA940" />
      <stop offset="80%" stop-color="#EB6A1D" />
      <stop offset="100%" stop-color="#C85310" />
    </linearGradient>

    <!-- Deep Pan Bowl Gradient -->
    <linearGradient id="masPanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA940" />
      <stop offset="30%" stop-color="#EB6A1D" />
      <stop offset="100%" stop-color="#A73200" />
    </linearGradient>

    <!-- Ambient Glow on Light BG -->
    <radialGradient id="masAura" cx="50%" cy="45%" r="52%">
      <stop offset="0%" stop-color="#EB6A1D" stop-opacity="0.12" />
      <stop offset="55%" stop-color="#EB6A1D" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#EB6A1D" stop-opacity="0" />
    </radialGradient>

    <!-- Drop Shadow for Heavy Weight -->
    <filter id="masShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#C85310" flood-opacity="0.35" />
    </filter>

    <filter id="masGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Glow -->
  <circle cx="270" cy="240" r="225" fill="url(#masAura)" />

  <!-- ========================================================================= -->
  <!-- STATIC HEAVY BASE & COLUMN (SOLID PURE ORANGE, MASSIVE PRESENCE)          -->
  <!-- ========================================================================= -->
  <g id="massiveBaseAndPillar" filter="url(#masShadow)">
    <!-- Base Plinth Tier 1 (Ground Tier - 280px wide) -->
    <rect x="130" y="430" width="280" height="22" rx="7" fill="url(#masOrange)" />
    <line x1="138" y1="433" x2="402" y2="433" stroke="#FFE4D6" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />

    <!-- Base Plinth Tier 2 (Middle Stepped Tier - 200px wide) -->
    <rect x="170" y="408" width="200" height="22" rx="6" fill="url(#masOrange)" />
    <line x1="178" y1="411" x2="362" y2="411" stroke="#FFE4D6" stroke-width="2" stroke-linecap="round" opacity="0.85" />

    <!-- Base Plinth Tier 3 (Top Collar Plinth - 100px wide) -->
    <rect x="220" y="390" width="100" height="18" rx="5" fill="url(#masOrange)" />

    <!-- Heavy Solid Vertical Pillar (24px width, from Y=140 to Y=390) -->
    <rect x="258" y="140" width="24" height="254" rx="5" fill="url(#masOrange)" />
    <!-- Center Column Specular Ridge Highlight -->
    <line x1="270" y1="145" x2="270" y2="388" stroke="#FFE4D6" stroke-width="3" stroke-linecap="round" opacity="0.75" />

    <!-- Heavy Architectural Collar Rings on Shaft -->
    <rect x="252" y="245" width="36" height="10" rx="5" fill="#C85310" />
    <rect x="252" y="335" width="36" height="10" rx="5" fill="#C85310" />

    <!-- Pillar Capital at Neck -->
    <path d="M 250 134 L 290 134 L 284 144 L 256 144 Z" fill="url(#masOrange)" />

    <!-- Top Heavy Spearhead Finial -->
    <path d="M 270 70 L 285 92 L 270 108 L 255 92 Z" fill="url(#masOrange)" />
    <circle cx="270" cy="68" r="5" fill="#FFA940" />
    <line x1="270" y1="108" x2="270" y2="128" stroke="url(#masOrange)" stroke-width="6" stroke-linecap="round" />
    <line x1="270" y1="108" x2="270" y2="128" stroke="#FFE4D6" stroke-width="2.2" stroke-linecap="round" />
  </g>

  <!-- ========================================================================= -->
  <!-- KINEMATICALLY RIGGED HEAVY CROSSBEAM & WEIGHING PANS                      -->
  <!-- Fulcrum Pivot Point: (270, 140)                                           -->
  <!-- Left Hook: Local (-190, 0) -> World (80, 140)                             -->
  <!-- Right Hook: Local (+190, 0) -> World (460, 140)                           -->
  <!-- Noticeable 66px vertical motion! SMIL + CSS Dual-Engine Guarantee         -->
  <!-- ========================================================================= -->
  <g id="scaleKinematicBeam" class="scale-beam-rig">
    <!-- NATIVE SMIL ANIMATION: Guaranteed 100% to run in every browser engine -->
    <animateTransform
      attributeName="transform"
      type="rotate"
      values="-10 270 140; 10 270 140; -10 270 140"
      dur="4.2s"
      repeatCount="indefinite"
      keyTimes="0; 0.5; 1"
      calcMode="spline"
      keySplines="0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95"
    />

    <!-- Precision Plumb Needle (Moves with beam) -->
    <polygon points="267.5,140 270,92 272.5,140" fill="#C85310" />
    <circle cx="270" cy="91" r="3" fill="#FFA940" />

    <!-- Heavy Solid Arched Crossbeam Bar (Spans from X=80 to X=460) -->
    <path d="M 270 132 C 205 124 140 120 80 138 C 80 145 140 135 270 144 C 400 135 460 145 460 138 C 400 120 335 124 270 132 Z" 
          fill="url(#masBeamGrad)" stroke="#C85310" stroke-width="1.2" />

    <!-- Upper Specular Highlight along Crossbeam -->
    <path d="M 265 135 C 210 126 150 124 92 138" fill="none" stroke="#FFE4D6" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />
    <path d="M 275 135 C 330 126 390 124 448 138" fill="none" stroke="#FFE4D6" stroke-width="2.2" stroke-linecap="round" opacity="0.85" />

    <!-- Left Hook Ring on Beam (Center at 80, 140) -->
    <circle cx="80" cy="140" r="10" fill="none" stroke="#EB6A1D" stroke-width="4" />
    <circle cx="80" cy="140" r="4" fill="#C85310" />

    <!-- Right Hook Ring on Beam (Center at 460, 140) -->
    <circle cx="460" cy="140" r="10" fill="none" stroke="#EB6A1D" stroke-width="4" />
    <circle cx="460" cy="140" r="4" fill="#C85310" />

    <!-- Central Fulcrum Medallion (Center at 270, 140) -->
    <circle cx="270" cy="140" r="23" fill="url(#masOrange)" filter="url(#masGlow)" />
    <circle cx="270" cy="140" r="15" fill="#FFFFFF" />
    <circle cx="270" cy="140" r="8" fill="#EB6A1D" />

    <!-- ===================================================================== -->
    <!-- LEFT PAN ASSEMBLY ("Jaha samaan dalta hai - upar niche move hota hai") -->
    <!-- Parented at local (80, 140). Counter-rotates around (0, 0).           -->
    <!-- ===================================================================== -->
    <g transform="translate(80, 140)">
      <g id="scaleLeftCounterGroup" class="scale-counter-left">
        <!-- NATIVE SMIL COUNTER-ROTATION: 100% attached to hook, 100% level -->
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="10 0 0; -10 0 0; 10 0 0"
          dur="4.2s"
          repeatCount="indefinite"
          keyTimes="0; 0.5; 1"
          calcMode="spline"
          keySplines="0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95"
        />

        <!-- Top Anchor Ring locked through the hook eyelet -->
        <circle cx="0" cy="0" r="5" fill="none" stroke="#FFA940" stroke-width="2.4" />

        <!-- Heavy Suspension Cords (Zero Detachment at (0, 0)) -->
        <!-- Center-rear cord -->
        <line x1="0" y1="4" x2="0" y2="137" stroke="#C85310" stroke-width="2" stroke-dasharray="3 3" opacity="0.75" />
        <!-- Front-left cord -->
        <line x1="0" y1="4" x2="-60" y2="140" stroke="#EB6A1D" stroke-width="3" stroke-linecap="round" />
        <!-- Front-right cord -->
        <line x1="0" y1="4" x2="60" y2="140" stroke="#EB6A1D" stroke-width="3" stroke-linecap="round" />

        <!-- Heavy Deep Weighing Pan Bowl (124px wide, 48px deep) -->
        <path d="M -62 140 Q 0 192 62 140 Q 0 154 -62 140 Z" fill="url(#masPanGrad)" stroke="#C85310" stroke-width="1.8" filter="url(#masShadow)" />

        <!-- Heavy Top Rim Lip -->
        <ellipse cx="0" cy="140" rx="62" ry="11" fill="#EB6A1D" />
        <ellipse cx="0" cy="140" rx="55" ry="8" fill="#FFA940" />
        <ellipse cx="0" cy="140" rx="46" ry="5.5" fill="#C85310" opacity="0.5" />
      </g>
    </g>

    <!-- ===================================================================== -->
    <!-- RIGHT PAN ASSEMBLY ("Jaha samaan dalta hai - upar niche move hota hai")-->
    <!-- Parented at local (460, 140). Counter-rotates around (0, 0).          -->
    <!-- ===================================================================== -->
    <g transform="translate(460, 140)">
      <g id="scaleRightCounterGroup" class="scale-counter-right">
        <!-- NATIVE SMIL COUNTER-ROTATION: 100% attached to hook, 100% level -->
        <animateTransform
          attributeName="transform"
          type="rotate"
          values="10 0 0; -10 0 0; 10 0 0"
          dur="4.2s"
          repeatCount="indefinite"
          keyTimes="0; 0.5; 1"
          calcMode="spline"
          keySplines="0.45 0.05 0.55 0.95; 0.45 0.05 0.55 0.95"
        />

        <!-- Top Anchor Ring locked through the hook eyelet -->
        <circle cx="0" cy="0" r="5" fill="none" stroke="#FFA940" stroke-width="2.4" />

        <!-- Heavy Suspension Cords (Zero Detachment at (0, 0)) -->
        <!-- Center-rear cord -->
        <line x1="0" y1="4" x2="0" y2="137" stroke="#C85310" stroke-width="2" stroke-dasharray="3 3" opacity="0.75" />
        <!-- Front-left cord -->
        <line x1="0" y1="4" x2="-60" y2="140" stroke="#EB6A1D" stroke-width="3" stroke-linecap="round" />
        <!-- Front-right cord -->
        <line x1="0" y1="4" x2="60" y2="140" stroke="#EB6A1D" stroke-width="3" stroke-linecap="round" />

        <!-- Heavy Deep Weighing Pan Bowl (124px wide, 48px deep) -->
        <path d="M -62 140 Q 0 192 62 140 Q 0 154 -62 140 Z" fill="url(#masPanGrad)" stroke="#C85310" stroke-width="1.8" filter="url(#masShadow)" />

        <!-- Heavy Top Rim Lip -->
        <ellipse cx="0" cy="140" rx="62" ry="11" fill="#EB6A1D" />
        <ellipse cx="0" cy="140" rx="55" ry="8" fill="#FFA940" />
        <ellipse cx="0" cy="140" rx="46" ry="5.5" fill="#C85310" opacity="0.5" />
      </g>
    </g>

  </g>
</svg>
