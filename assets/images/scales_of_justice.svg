<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 520" class="w-full h-auto select-none" aria-label="Groverlaw Chambers - Dual Jurisdiction Scales of Justice">
  <defs>
    <!-- Background Radial Ambient Glow -->
    <radialGradient id="scalesAura" cx="50%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#EB6A1D" stop-opacity="0.18" />
      <stop offset="45%" stop-color="#EB6A1D" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic Gold/Brass Beam Gradient -->
    <linearGradient id="brassBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A3412" />
      <stop offset="15%" stop-color="#D97706" />
      <stop offset="35%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="65%" stop-color="#FCD34D" />
      <stop offset="85%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#9A3412" />
    </linearGradient>

    <!-- Metallic Column Gradient -->
    <linearGradient id="brassColumnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451A03" />
      <stop offset="25%" stop-color="#B45309" />
      <stop offset="50%" stop-color="#FDE68A" />
      <stop offset="75%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <!-- Scale Pan Top Metallic Rim -->
    <linearGradient id="panRimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350F" />
      <stop offset="20%" stop-color="#D97706" />
      <stop offset="50%" stop-color="#FEF3C7" />
      <stop offset="80%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Scale Pan Bowl Interior Depth -->
    <radialGradient id="panBowlDepth" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="60%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>

    <!-- Scale Pan Exterior Metallic Glow -->
    <linearGradient id="panExteriorGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="30%" stop-color="#9A3412" />
      <stop offset="80%" stop-color="#451A03" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Drop Shadow for Dimensional Realism -->
    <filter id="chambersShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="goldGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Glow Behind Scales -->
  <circle cx="300" cy="240" r="230" fill="url(#scalesAura)" />

  <!-- Classical Architectural Guilloche Seal Rings in Background -->
  <g opacity="0.22">
    <!-- Outer Roman Tick Ring -->
    <circle cx="300" cy="240" r="215" fill="none" stroke="#D97706" stroke-width="1.2" stroke-dasharray="3 7" />
    <circle cx="300" cy="240" r="202" fill="none" stroke="#D97706" stroke-width="0.8" />
    <circle cx="300" cy="240" r="172" fill="none" stroke="#EB6A1D" stroke-width="0.6" stroke-dasharray="2 12" />
    <circle cx="300" cy="240" r="120" fill="none" stroke="#D97706" stroke-width="0.5" stroke-dasharray="1 8" />

    <!-- Subtle Neoclassical Cardinal Crosshairs -->
    <line x1="300" y1="30" x2="300" y2="450" stroke="#D97706" stroke-width="0.5" stroke-dasharray="4 8" />
    <line x1="90" y1="240" x2="510" y2="240" stroke="#D97706" stroke-width="0.5" stroke-dasharray="4 8" />
  </g>

  <!-- ========================================================================= -->
  <!-- STATIC BASE & NEOCLASSICAL PILLAR OF JUSTICE                              -->
  <!-- ========================================================================= -->
  <g id="scaleBaseAndPillar" filter="url(#chambersShadow)">
    <!-- Base Stepped Plinth (Tier 1 - Ground) -->
    <path d="M 190 470 L 410 470 L 400 482 L 200 482 Z" fill="#0F172A" stroke="#78350F" stroke-width="1" />
    <line x1="200" y1="482" x2="400" y2="482" stroke="#FEF3C7" stroke-width="0.75" opacity="0.6" />

    <!-- Base Stepped Plinth (Tier 2 - Chamfered Marble/Bronze) -->
    <path d="M 215 450 L 385 450 L 395 470 L 205 470 Z" fill="#1E293B" stroke="#B45309" stroke-width="1.2" />
    <rect x="235" y="454" width="130" height="12" rx="2" fill="#0B1120" stroke="#D97706" stroke-width="0.7" />
    <text x="300" y="463" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="7.5" font-weight="700" fill="#FDE68A" letter-spacing="2.5">AEQUITAS ET IUSTITIA</text>

    <!-- Base Molding Cap -->
    <path d="M 245 440 L 355 440 L 360 450 L 240 450 Z" fill="url(#brassBeamGrad)" stroke="#78350F" stroke-width="0.8" />

    <!-- Neoclassical Fluted Column (Shaft) -->
    <rect x="290" y="200" width="20" height="240" fill="url(#brassColumnGrad)" rx="2" stroke="#78350F" stroke-width="0.8" />
    <!-- Fluting highlights on column -->
    <line x1="294" y1="202" x2="294" y2="438" stroke="#FEF3C7" stroke-width="0.9" opacity="0.8" />
    <line x1="300" y1="202" x2="300" y2="438" stroke="#451A03" stroke-width="1.2" opacity="0.7" />
    <line x1="306" y1="202" x2="306" y2="438" stroke="#FEF3C7" stroke-width="0.9" opacity="0.8" />

    <!-- Column Capital / Acanthus Collar -->
    <path d="M 284 196 L 316 196 L 312 204 L 288 204 Z" fill="url(#brassBeamGrad)" stroke="#78350F" stroke-width="0.8" />

    <!-- Calibrated Equilibrium Gauge Arc (Behind needle) -->
    <path d="M 276 138 A 32 32 0 0 1 324 138" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" />
    <!-- Degree graduation ticks -->
    <line x1="280" y1="135" x2="282" y2="139" stroke="#FDE68A" stroke-width="1" />
    <line x1="290" y1="130" x2="291" y2="134" stroke="#FDE68A" stroke-width="1" />
    <line x1="300" y1="128" x2="300" y2="133" stroke="#EB6A1D" stroke-width="1.6" />
    <line x1="310" y1="130" x2="309" y2="134" stroke="#FDE68A" stroke-width="1" />
    <line x1="320" y1="135" x2="318" y2="139" stroke="#FDE68A" stroke-width="1" />

    <!-- Top Finial / Crown / Sword Pommel -->
    <path d="M 300 95 L 305 108 L 300 115 L 295 108 Z" fill="url(#brassBeamGrad)" stroke="#78350F" stroke-width="0.8" />
    <circle cx="300" cy="94" r="3.5" fill="#FEF3C7" stroke="#D97706" stroke-width="0.8" />
    <line x1="300" y1="115" x2="300" y2="175" stroke="url(#brassColumnGrad)" stroke-width="4" stroke-linecap="round" />
  </g>

  <!-- ========================================================================= -->
  <!-- ARTICULATED MOVING BALANCE MECHANISM (ANIMATED)                            -->
  <!-- ========================================================================= -->
  <!-- 
       Fulcrum Pivot Point: (300, 180)
       Beam spans from X=130 to X=470 (length = 340px)
       Left hook: (130, 180)
       Right hook: (470, 180)
  -->
  <g id="scaleRig" class="scale-animated-rig">

    <!-- 1. TILTING CROSSBEAM & PRECISION NEEDLE (Rotates around 300, 180) -->
    <g id="scaleBeamGroup" class="scale-beam-motion" style="transform-origin: 300px 180px;">
      
      <!-- Precision Vertical Plumb-Line Needle -->
      <polygon points="298,180 300,126 302,180" fill="#EB6A1D" stroke="#FEF3C7" stroke-width="0.5" filter="url(#goldGlow)" />
      <circle cx="300" cy="125" r="2" fill="#FFFFFF" />

      <!-- The Crossbeam (Double-arched architectural brass beam) -->
      <!-- Left Arm -->
      <path d="M 300 178 C 250 172 180 166 130 180 C 130 183 180 176 300 182 Z" 
            fill="url(#brassBeamGrad)" stroke="#78350F" stroke-width="0.8" />
      <!-- Right Arm -->
      <path d="M 300 178 C 350 172 420 166 470 180 C 470 183 420 176 300 182 Z" 
            fill="url(#brassBeamGrad)" stroke="#78350F" stroke-width="0.8" />

      <!-- Architectural Scroll Filigree Brackets -->
      <path d="M 230 174 C 210 160 170 166 140 178" fill="none" stroke="#D97706" stroke-width="1.2" stroke-linecap="round" />
      <path d="M 370 174 C 390 160 430 166 460 178" fill="none" stroke="#D97706" stroke-width="1.2" stroke-linecap="round" />

      <!-- Left Forged End Ring / Shackle -->
      <circle cx="130" cy="180" r="5" fill="none" stroke="#FEF3C7" stroke-width="1.8" />
      <circle cx="130" cy="180" r="2.2" fill="#78350F" />

      <!-- Right Forged End Ring / Shackle -->
      <circle cx="470" cy="180" r="5" fill="none" stroke="#FEF3C7" stroke-width="1.8" />
      <circle cx="470" cy="180" r="2.2" fill="#78350F" />

      <!-- Central Fulcrum Medallion -->
      <circle cx="300" cy="180" r="14" fill="url(#brassColumnGrad)" stroke="#78350F" stroke-width="1.5" />
      <circle cx="300" cy="180" r="9" fill="#0B1120" stroke="#FEF3C7" stroke-width="1" />
      <circle cx="300" cy="180" r="4.5" fill="#EB6A1D" filter="url(#goldGlow)" />
      <circle cx="300" cy="180" r="1.5" fill="#FFFFFF" />
    </g>

    <!-- 2. LEFT WEIGHING SCALE PAN ASSEMBLY (Translates vertically, stays level) -->
    <g id="scaleLeftPanAssembly" class="scale-left-motion" style="transform-origin: 130px 180px;">
      <!-- Suspension Chains (Left, Center, Right strings) -->
      <!-- Center string to rear rim -->
      <line x1="130" y1="185" x2="130" y2="305" stroke="#B45309" stroke-width="1" stroke-dasharray="2 3" opacity="0.75" />
      <!-- Left string to front-left rim -->
      <line x1="130" y1="185" x2="72" y2="310" stroke="#FDE68A" stroke-width="1.2" stroke-dasharray="3 3" />
      <!-- Right string to front-right rim -->
      <line x1="130" y1="185" x2="188" y2="310" stroke="#FDE68A" stroke-width="1.2" stroke-dasharray="3 3" />

      <!-- Pan Bowl Exterior Curved Underside -->
      <path d="M 68 310 Q 130 355 192 310 Z" fill="url(#panExteriorGrad)" stroke="#78350F" stroke-width="1.2" filter="url(#chambersShadow)" />
      <!-- Bottom Rim Lip -->
      <path d="M 100 338 Q 130 348 160 338" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" />

      <!-- Pan Interior Bowl Depth -->
      <ellipse cx="130" cy="310" rx="62" ry="14" fill="url(#panBowlDepth)" stroke="url(#panRimGrad)" stroke-width="2" />

      <!-- Pan Top Metallic Lip Inner Specular Highlight -->
      <ellipse cx="130" cy="310" rx="58" ry="11" fill="none" stroke="#FEF3C7" stroke-width="0.8" opacity="0.85" />

      <!-- Inscribed Legal Token / Artifact on Left Pan (Delhi High Court IPD) -->
      <g transform="translate(130, 310)">
        <ellipse cx="0" cy="0" rx="34" ry="7" fill="#0B1120" stroke="#EB6A1D" stroke-width="0.8" />
        <text x="0" y="2.5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="6" font-weight="700" fill="#FDE68A" letter-spacing="1">NEW DELHI • 1996</text>
      </g>
    </g>

    <!-- 3. RIGHT WEIGHING SCALE PAN ASSEMBLY (Translates inversely, stays level) -->
    <g id="scaleRightPanAssembly" class="scale-right-motion" style="transform-origin: 470px 180px;">
      <!-- Suspension Chains (Left, Center, Right strings) -->
      <!-- Center string to rear rim -->
      <line x1="470" y1="185" x2="470" y2="305" stroke="#B45309" stroke-width="1" stroke-dasharray="2 3" opacity="0.75" />
      <!-- Left string to front-left rim -->
      <line x1="470" y1="185" x2="412" y2="310" stroke="#FDE68A" stroke-width="1.2" stroke-dasharray="3 3" />
      <!-- Right string to front-right rim -->
      <line x1="470" y1="185" x2="528" y2="310" stroke="#FDE68A" stroke-width="1.2" stroke-dasharray="3 3" />

      <!-- Pan Bowl Exterior Curved Underside -->
      <path d="M 408 310 Q 470 355 532 310 Z" fill="url(#panExteriorGrad)" stroke="#78350F" stroke-width="1.2" filter="url(#chambersShadow)" />
      <!-- Bottom Rim Lip -->
      <path d="M 440 338 Q 470 348 500 338" fill="none" stroke="#D97706" stroke-width="1.5" stroke-linecap="round" />

      <!-- Pan Interior Bowl Depth -->
      <ellipse cx="470" cy="310" rx="62" ry="14" fill="url(#panBowlDepth)" stroke="url(#panRimGrad)" stroke-width="2" />

      <!-- Pan Top Metallic Lip Inner Specular Highlight -->
      <ellipse cx="470" cy="310" rx="58" ry="11" fill="none" stroke="#FEF3C7" stroke-width="0.8" opacity="0.85" />

      <!-- Inscribed Legal Token / Artifact on Right Pan (Roll of Solicitors London) -->
      <g transform="translate(470, 310)">
        <ellipse cx="0" cy="0" rx="34" ry="7" fill="#0B1120" stroke="#EB6A1D" stroke-width="0.8" />
        <text x="0" y="2.5" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="6" font-weight="700" fill="#FDE68A" letter-spacing="1">LONDON • 2002</text>
      </g>
    </g>

  </g>
</svg>