<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 440" class="w-full h-auto max-w-[480px] select-none" aria-label="Groverlaw - Heavy Minimalist Scales of Justice">
  <defs>
    <!-- Heavy Solid Brand Orange Gradient -->
    <linearGradient id="heavyOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FA8C16" />
      <stop offset="40%" stop-color="#EB6A1D" />
      <stop offset="100%" stop-color="#C85310" />
    </linearGradient>

    <!-- Heavy Arched Beam Gradient -->
    <linearGradient id="heavyBeamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C85310" />
      <stop offset="20%" stop-color="#EB6A1D" />
      <stop offset="50%" stop-color="#FFA940" />
      <stop offset="80%" stop-color="#EB6A1D" />
      <stop offset="100%" stop-color="#C85310" />
    </linearGradient>

    <!-- Heavy Pan Bowl Gradient -->
    <linearGradient id="heavyPanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFA940" />
      <stop offset="35%" stop-color="#EB6A1D" />
      <stop offset="100%" stop-color="#A73200" />
    </linearGradient>

    <!-- Subtle Orange Atmosphere Glow -->
    <radialGradient id="heavyAura" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#EB6A1D" stop-opacity="0.10" />
      <stop offset="60%" stop-color="#EB6A1D" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#EB6A1D" stop-opacity="0" />
    </radialGradient>

    <!-- Soft Drop Shadow for Heavy Weight & Grounding -->
    <filter id="heavyShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#C85310" flood-opacity="0.3" />
    </filter>

    <filter id="heavyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Warmth -->
  <circle cx="250" cy="230" r="200" fill="url(#heavyAura)" />

  <!-- ========================================================================= -->
  <!-- STATIC HEAVY BASE & PILLAR (SOLID ORANGE, GROUNDED)                       -->
  <!-- ========================================================================= -->
  <g id="heavyBaseAndPillar" filter="url(#heavyShadow)">
    <!-- Base Plinth Tier 1 (Heavy Ground Tier) -->
    <rect x="130" y="392" width="240" height="18" rx="6" fill="url(#heavyOrange)" />
    <!-- Tier 1 Top Chamfer Highlight -->
    <line x1="136" y1="394" x2="364" y2="394" stroke="#FFE4D6" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />

    <!-- Base Plinth Tier 2 (Middle Stepped Tier) -->
    <rect x="165" y="374" width="170" height="18" rx="5" fill="url(#heavyOrange)" />
    <line x1="172" y1="376" x2="328" y2="376" stroke="#FFE4D6" stroke-width="1.5" stroke-linecap="round" opacity="0.8" />

    <!-- Base Plinth Tier 3 (Top Collar Plinth) -->
    <rect x="210" y="358" width="80" height="16" rx="4" fill="url(#heavyOrange)" />

    <!-- Heavy Solid Vertical Pillar (20px width) -->
    <rect x="240" y="130" width="20" height="230" rx="4" fill="url(#heavyOrange)" />
    <!-- Center Column Specular Ridge Highlight -->
    <line x1="250" y1="135" x2="250" y2="355" stroke="#FFE4D6" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />

    <!-- Heavy Architectural Collar Rings on Shaft -->
    <rect x="235" y="225" width="30" height="8" rx="4" fill="#C85310" />
    <rect x="235" y="305" width="30" height="8" rx="4" fill="#C85310" />

    <!-- Pillar Capital at Neck -->
    <path d="M 234 125 L 266 125 L 260 134 L 240 134 Z" fill="url(#heavyOrange)" />

    <!-- Top Heavy Spearhead Finial -->
    <path d="M 250 68 L 263 88 L 250 102 L 237 88 Z" fill="url(#heavyOrange)" />
    <circle cx="250" cy="66" r="4.5" fill="#FFA940" />
    <line x1="250" y1="102" x2="250" y2="120" stroke="url(#heavyOrange)" stroke-width="5" stroke-linecap="round" />
    <line x1="250" y1="102" x2="250" y2="120" stroke="#FFE4D6" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- ========================================================================= -->
  <!-- KINEMATICALLY RIGGED HEAVY CROSSBEAM & WEIGHING PANS                      -->
  <!-- Fulcrum Pivot Point: (250, 130)                                           -->
  <!-- Left Hook Eyelet: Local (-170, 0) -> World (80, 130)                      -->
  <!-- Right Hook Eyelet: Local (+170, 0) -> World (420, 130)                    -->
  <!-- ========================================================================= -->
  <g id="scaleKinematicBeam" class="scale-beam-rig">

    <!-- Precision Plumb Needle (Moves with beam) -->
    <polygon points="248,130 250,88 252,130" fill="#C85310" />
    <circle cx="250" cy="87" r="2.5" fill="#FFA940" />

    <!-- Heavy Solid Arched Crossbeam Bar (Spans from X=80 to X=420) -->
    <path d="M 250 123 C 190 115 130 112 80 128 C 80 134 130 125 250 133 C 370 125 420 134 420 128 C 370 112 310 115 250 123 Z" 
          fill="url(#heavyBeamGrad)" stroke="#C85310" stroke-width="1" />

    <!-- Upper Specular Highlight along Crossbeam -->
    <path d="M 245 125 C 195 117 140 115 90 128" fill="none" stroke="#FFE4D6" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
    <path d="M 255 125 C 305 117 360 115 410 128" fill="none" stroke="#FFE4D6" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />

    <!-- Left Hook Ring on Beam (Center at 80, 130) -->
    <circle cx="80" cy="130" r="9" fill="none" stroke="#EB6A1D" stroke-width="3.5" />
    <circle cx="80" cy="130" r="3.5" fill="#C85310" />

    <!-- Right Hook Ring on Beam (Center at 420, 130) -->
    <circle cx="420" cy="130" r="9" fill="none" stroke="#EB6A1D" stroke-width="3.5" />
    <circle cx="420" cy="130" r="3.5" fill="#C85310" />

    <!-- Central Fulcrum Medallion (Center at 250, 130) -->
    <circle cx="250" cy="130" r="20" fill="url(#heavyOrange)" filter="url(#heavyGlow)" />
    <circle cx="250" cy="130" r="13" fill="#FFFFFF" />
    <circle cx="250" cy="130" r="7" fill="#EB6A1D" />

    <!-- ===================================================================== -->
    <!-- LEFT PAN ASSEMBLY ("Jaha samaan dalta hai - upar niche move hota hai") -->
    <!-- Parented at local (80, 130). Counter-rotates around (0, 0).           -->
    <!-- ===================================================================== -->
    <g transform="translate(80, 130)">
      <g id="scaleLeftCounterGroup" class="scale-counter-left">
        <!-- Top Anchor Ring locked through the hook eyelet -->
        <circle cx="0" cy="0" r="4.5" fill="none" stroke="#FFA940" stroke-width="2" />

        <!-- Heavy Suspension Cords (Zero Detachment at (0, 0)) -->
        <!-- Center-rear cord -->
        <line x1="0" y1="3" x2="0" y2="123" stroke="#C85310" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.75" />
        <!-- Front-left cord -->
        <line x1="0" y1="3" x2="-52" y2="125" stroke="#EB6A1D" stroke-width="2.6" stroke-linecap="round" />
        <!-- Front-right cord -->
        <line x1="0" y1="3" x2="52" y2="125" stroke="#EB6A1D" stroke-width="2.6" stroke-linecap="round" />

        <!-- Heavy Deep Weighing Pan Bowl -->
        <path d="M -54 125 Q 0 172 54 125 Q 0 138 -54 125 Z" fill="url(#heavyPanGrad)" stroke="#C85310" stroke-width="1.5" filter="url(#heavyShadow)" />

        <!-- Heavy Top Rim Lip -->
        <ellipse cx="0" cy="125" rx="54" ry="9" fill="#EB6A1D" />
        <ellipse cx="0" cy="125" rx="48" ry="6.5" fill="#FFA940" />
        <ellipse cx="0" cy="125" rx="40" ry="4.5" fill="#C85310" opacity="0.5" />
      </g>
    </g>

    <!-- ===================================================================== -->
    <!-- RIGHT PAN ASSEMBLY ("Jaha samaan dalta hai - upar niche move hota hai")-->
    <!-- Parented at local (420, 130). Counter-rotates around (0, 0).          -->
    <!-- ===================================================================== -->
    <g transform="translate(420, 130)">
      <g id="scaleRightCounterGroup" class="scale-counter-right">
        <!-- Top Anchor Ring locked through the hook eyelet -->
        <circle cx="0" cy="0" r="4.5" fill="none" stroke="#FFA940" stroke-width="2" />

        <!-- Heavy Suspension Cords (Zero Detachment at (0, 0)) -->
        <!-- Center-rear cord -->
        <line x1="0" y1="3" x2="0" y2="123" stroke="#C85310" stroke-width="1.8" stroke-dasharray="3 3" opacity="0.75" />
        <!-- Front-left cord -->
        <line x1="0" y1="3" x2="-52" y2="125" stroke="#EB6A1D" stroke-width="2.6" stroke-linecap="round" />
        <!-- Front-right cord -->
        <line x1="0" y1="3" x2="52" y2="125" stroke="#EB6A1D" stroke-width="2.6" stroke-linecap="round" />

        <!-- Heavy Deep Weighing Pan Bowl -->
        <path d="M -54 125 Q 0 172 54 125 Q 0 138 -54 125 Z" fill="url(#heavyPanGrad)" stroke="#C85310" stroke-width="1.5" filter="url(#heavyShadow)" />

        <!-- Heavy Top Rim Lip -->
        <ellipse cx="0" cy="125" rx="54" ry="9" fill="#EB6A1D" />
        <ellipse cx="0" cy="125" rx="48" ry="6.5" fill="#FFA940" />
        <ellipse cx="0" cy="125" rx="40" ry="4.5" fill="#C85310" opacity="0.5" />
      </g>
    </g>

  </g>
</svg>
